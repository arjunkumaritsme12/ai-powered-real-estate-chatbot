services:
  - type: web
    name: propertyiq-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: OPENROUTER_FALLBACK_MODELS
        value: nvidia/nemotron-3-ultra-550b-a55b:free,google/gemma-4-31b-it:free
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-4-hydrogen
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite
      - key: AI_PROVIDER
        value: gemini
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: https://propertyiq.onrender.com,http://localhost:5173,http://localhost:3000
      - key: DATA_DIR
        value: /app/data
      - key: APP_ENV
        value: production
    healthCheckPath: /health
  - type: web
    name: propertyiq
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: API_BASE_URL
        value: https://propertyiq-api.onrender.com/api

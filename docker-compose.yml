services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - propertyiq-data:/app/data
  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: ${API_BASE_URL:-}
    ports:
      - "3000:80"
    depends_on:
      - backend
volumes:
  propertyiq-data:
